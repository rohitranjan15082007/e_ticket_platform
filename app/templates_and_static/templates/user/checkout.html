<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Checkout · E-Ticket</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/user.css">
  <link rel="stylesheet" href="/assets/css/user-v2.css">
  <link rel="stylesheet" href="/assets/css/commerce-v2.css">
</head>
<body class="user-v2 commerce-v2" data-area="user" data-page="checkout">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="shell header-inner">
    <a class="brand" href="/" aria-label="E-Ticket home"><span class="brand-mark">E</span><span>E-Ticket</span></a>
    <nav id="site-nav" aria-label="Main navigation"><a href="/series">Series</a><a href="/packages">Packages</a><a href="/results">Results</a></nav>
  </div></header>
  <main id="main" class="shell"><div class="account-layout">
    <aside id="account-sidebar" class="account-sidebar" aria-label="Account navigation"></aside>
    <div class="account-main">
      <div class="page-heading"><p class="eyebrow">Choose · Review · Pay</p><h1>Checkout</h1><p>Review the server-priced order and follow its payment state. Selecting a method never confirms settlement.</p></div>
      <div id="status" class="notice" role="status" aria-live="polite" hidden></div>
      <div id="page-content"><p class="muted">Loading…</p></div>
    </div>
  </div></main>
  <nav id="account-mobile-nav" class="account-mobile-nav" aria-label="Mobile account navigation"></nav>
  <footer class="site-footer"><div class="shell">Tickets and payments are final only when the server confirms them. <a href="/results">Public results</a></div></footer>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
