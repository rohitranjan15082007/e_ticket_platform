name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticket_test
          POSTGRES_PASSWORD: ticket_test_password
          POSTGRES_DB: ticket_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_test -d ticket_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # This fixed URL can reach only the runner's disposable PostgreSQL service.
      # The concurrency fixture truncates data and migrates down to base.
      TICKET_APP_ENV: development
      TICKET_DATABASE_URL: postgresql+asyncpg://ticket_test:ticket_test_password@127.0.0.1:5432/ticket_platform_test
      TICKET_TEST_DATABASE_URL: postgresql+asyncpg://ticket_test:ticket_test_password@127.0.0.1:5432/ticket_platform_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run the complete pytest suite
        run: python -m pytest -q -ra --color=no --junitxml=pytest-results.xml

      - name: Assert all nine PostgreSQL race tests executed
        run: |
          python - <<'PY'
          from xml.etree import ElementTree

          root = ElementTree.parse("pytest-results.xml").getroot()
          race_cases = [
              case for case in root.iter("testcase")
              if case.get("classname", "").endswith("test_wallet_locking")
          ]
          skipped = [case.get("name") for case in race_cases if case.find("skipped") is not None]
          if len(race_cases) != 9 or skipped:
              raise SystemExit(
                  f"Expected nine executed PostgreSQL race tests; "
                  f"found {len(race_cases)}, skipped: {skipped}"
              )
          print("All nine PostgreSQL race tests executed.")
          PY
